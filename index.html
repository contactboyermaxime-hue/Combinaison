:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1624; --panel:#182235; --fg:#e8edf6; --muted:#9aa7bd; --line:#2b3850;

:root[data-theme="dark"]{
  --bg:#0f1624; --panel:#182235; --fg:#e8edf6; --muted:#9aa7bd; --line:#2b3850;
  --accent:#6f9bea; --accent-fg:#0f1624; --active:#22314c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.tabs,.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:600 14px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs button{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:6px 14px}
.main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.board{display:flex;flex-direction:column;gap:10px;min-width:0}
svg{display:block;width:100%;height:auto;border-radius:8px;background:var(--turf)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent)}
#play{min-width:104px;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.side h2{font-family:var(--display);font-size:26px;line-height:1;margin:0;text-transform:uppercase}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ctx{margin:0;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
li{display:flex;gap:10px;padding:7px 9px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
li .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none;padding-top:1px}
li.on{background:var(--active);border-left-color:var(--accent);font-weight:500}
.note{margin:0;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.trig{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:var(--ball);color:#2a2300;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.legend{margin:0;font-size:13.5px;color:var(--muted)}
.tok text{font:600 11px var(--body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}

// Soutien automatique : tout joueur de 9 à 15 sans course suit le jeu, derrière le ballon et sans toucher personne.
function addSupport(P){
  const pp=(id,tt)=>{const s=P.pl.find(q=>q[0]===id);let x=s[1],y=s[2];for(const m of P.mv){if(m[0]!==id)continue;if(tt>=m[2]){x=m[3];y=m[4];continue}
    if(tt>m[1]){const u=(tt-m[1])/(m[2]-m[1]),vx=m[5]!=null?m[5]:(x+m[3])/2,vy=m[5]!=null?m[6]:(y+m[4])/2,w=1-u;return [w*w*x+2*w*u*vx+u*u*m[3],w*w*y+2*w*u*vy+u*u*m[4]]}break}return [x,y]};
  const bb=tt=>{let h=P.holder;for(const q of P.ps){if(tt>=q[1]){h=q[3];continue}if(tt>=q[0]){const a=pp(q[2],q[0]),b=pp(q[3],q[1]),u=(tt-q[0])/(q[1]-q[0]);return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]}break}return pp(h,tt)};
  P.mv.sort((a,b)=>a[1]-b[1]);
  const T=Math.max(...P.mv.map(m=>m[2]),...P.ps.map(m=>m[1])),fb=bb(T);
  for(const [id,x,y] of P.pl){
    if(id<9||P.mv.some(m=>m[0]===id))continue;
    const own=P.ps.find(q=>q[2]===id),t0=own?own[1]:Math.min(P.ps[0][1],.6),lim={},sg=fb[0]>=x?1:-1;
    for(const [o] of P.pl){const q=pp(o,t0);lim[o]=Math.min(36,Math.hypot(q[0]-x,q[1]-y)-.5)}
    const ok=(tx,ty)=>{for(let tt=t0;tt<=T+.001;tt+=.04){const u=(tt-t0)/(T-t0),px=x+(tx-x)*u,py=y+(ty-y)*u;
        if(!own&&py<bb(tt)[1]+6)return false;
        for(const [o] of P.pl){if(o===id)continue;const q=pp(o,tt);if(Math.hypot(q[0]-px,q[1]-py)<lim[o])return false}}return true};
    let best=null;
    const dxs=own?[45,30,15,0]:[40,25,10,0],dys=own?[-20,-10,0]:[90,80,70,60,50,40,30,20,10];
    for(const d of dys){for(const k of dxs){if(ok(x+sg*k,y-d)){best=[x+sg*k,y-d];break}}if(best)break}
    if(!best)for(const k of [30,-30,20,-20])if(ok(x+k,y+10)){best=[x+k,y+10];break}
    if(best){P.mv.push([id,t0,T,best[0],best[1]]);P.mv.sort((a,b)=>a[1]-b[1])}
  }
}
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const svg=$("pitch");let cur=0,opt=0,t=0,T=4,playing=false,last=0,P,tok={},ballEl,runG,marks=[];

function drawPitch(){
  svg.innerHTML="";
  for(let i=0;i<8;i++)el("rect",{x:240,y:30+i*60,width:690,height:60,fill:i%2?"var(--turf2)":"var(--turf)"},svg);
  const L=(x1,y1,x2,y2,d)=>el("line",{x1,y1,x2,y2,stroke:"var(--chalk)","stroke-width":d?1.5:2.5,"stroke-dasharray":d||"none",opacity:d?.7:.9},svg);
  L(250,30,250,495);L(920,30,920,495);
  [58,147,262,380,468].forEach(y=>L(250,y,920,y));
  [220,303].forEach(y=>L(250,y,920,y,"10 8"));
  [293,390,775,870].forEach(x=>L(x,58,x,468,"8 10"));
  [58,468].forEach(y=>{const s=y<100?-1:1;el("path",{d:`M565 ${y+s*22}V${y}M605 ${y+s*22}V${y}M565 ${y+s*10}H605`,stroke:"var(--chalk)","stroke-width":4,fill:"none"},svg)});
  runG=el("g",{},svg);
}
function build(){
  const p=PLAYS[cur],o=p.opts?p.opts[opt]:{mv:[],ps:[],st:[]};
  P={pl:p.pl,holder:p.holder,mv:p.mv.concat(o.mv).sort((a,b)=>a[1]-b[1]),ps:p.ps.concat(o.ps).sort((a,b)=>a[0]-b[0]),st:p.st.concat(o.st).sort((a,b)=>a[0]-b[0])};
  addSupport(P);
  T=Math.max(...P.mv.map(m=>m[2]),...P.ps.map(m=>m[1]))+.4;
  drawPitch();tok={};
  P.pl.forEach(([id,x,y])=>{ // tracés des courses
    let d=`M${x} ${y}`,has=false;
    P.mv.filter(m=>m[0]===id).forEach(m=>{has=true;d+=m[5]!=null?`Q${m[5]} ${m[6]} ${m[3]} ${m[4]}`:`L${m[3]} ${m[4]}`});
    if(has)el("path",{d,fill:"none",stroke:"var(--run)","stroke-width":2,"stroke-dasharray":"5 5",opacity:.65},runG);
  });
  marks=P.mv.filter(m=>m[7]).map(m=>{const q=pos(m[0],m[1]);return {t:m[1],e:el("circle",{cx:q[0],cy:q[1],r:18,fill:"none",stroke:"var(--ball)"},svg)}});
  P.pl.forEach(([id])=>{
    const g=el("g",{class:"tok"},svg);
    el("circle",{r:13,fill:id<=8?"var(--fwd)":"var(--back)",stroke:"#fff","stroke-width":1.5},g);
    el("text",{},g).textContent=id;tok[id]=g;
  });
  ballEl=el("ellipse",{rx:8,ry:5.5,fill:"var(--ball)",stroke:"#3a3000","stroke-width":1},svg);
  $("name").textContent=p.name;$("ctx").textContent=p.ctx;$("ctx").hidden=!p.ctx;$("note").textContent=p.note;$("note").hidden=!p.note;
  $("opts").innerHTML="";
  (p.opts||[]).forEach((op,i)=>{const b=document.createElement("button");b.textContent=op.label;b.setAttribute("aria-pressed",i===opt);b.onclick=()=>{opt=i;stop();t=0;build()};$("opts").appendChild(b)});
  $("steps").innerHTML="";
  P.st.forEach(([ts,txt,trig])=>{const li=document.createElement("li");li.tabIndex=0;li.innerHTML=`<span class="t">${ts.toFixed(1)} s</span><span></span>`;li.lastChild.textContent=txt;if(trig){const k=document.createElement("b");k.className="trig";k.textContent="Top";li.lastChild.prepend(k)}
    const go=()=>{stop();t=ts+.001;draw()};li.onclick=go;li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};$("steps").appendChild(li)});
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===cur));
  runG.setAttribute("visibility",$("lines").getAttribute("aria-pressed")==="true"?"visible":"hidden");
  draw();
}
function pos(id,tt){
  const s=P.pl.find(q=>q[0]===id);let x=s[1],y=s[2];
  for(const m of P.mv){ if(m[0]!==id)continue;
    if(tt>=m[2]){x=m[3];y=m[4];continue}
    if(tt>m[1]){const u=(tt-m[1])/(m[2]-m[1]),vx=m[5]!=null?m[5]:(x+m[3])/2,vy=m[5]!=null?m[6]:(y+m[4])/2,w=1-u;
      return [w*w*x+2*w*u*vx+u*u*m[3],w*w*y+2*w*u*vy+u*u*m[4]]}
    break}
  return [x,y];
}
function ball(tt){
  let h=P.holder;
  for(const p of P.ps){
    if(tt>=p[1]){h=p[3];continue}
    if(tt>=p[0]){const a=pos(p[2],p[0]),b=pos(p[3],p[1]),u=(tt-p[0])/(p[1]-p[0]);return [a[0]+(b[0]-a[0])*u+11,a[1]+(b[1]-a[1])*u+4]}
    break}
  const q=pos(h,tt);return [q[0]+11,q[1]+4];
}
function draw(){
  P.pl.forEach(([id])=>{const q=pos(id,t);tok[id].setAttribute("transform",`translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})`)});
  const b=ball(t);ballEl.setAttribute("cx",b[0].toFixed(1));ballEl.setAttribute("cy",b[1].toFixed(1));
  marks.forEach(m=>{const on=t>=m.t-.05&&t<m.t+.5;m.e.setAttribute("stroke-width",on?5:2);m.e.setAttribute("opacity",on?1:.55)});
  $("scrub").value=Math.round(t/T*1000);
  let act=-1;P.st.forEach((s,i)=>{if(t>=s[0])act=i});
  [...$("steps").children].forEach((li,i)=>li.classList.toggle("on",i===act&&t>0));
}
function stop(){playing=false;$("play").textContent="▶ Lecture"}
function frame(now){
  if(!playing)return;
  const rate=$("slow").getAttribute("aria-pressed")==="true"?.45:1;
  t+=(now-last)/1000*rate;last=now;
  if(t>=T){t=T;stop()}
  draw();if(playing)requestAnimationFrame(frame);
}
$("play").onclick=()=>{if(playing){stop();return}if(t>=T)t=0;playing=true;$("play").textContent="❚❚ Pause";last=performance.now();requestAnimationFrame(frame)};
$("reset").onclick=()=>{stop();t=0;draw()};
$("scrub").oninput=e=>{stop();t=e.target.value/1000*T;draw()};
const tog=id=>{const b=$(id);b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")};
$("slow").onclick=()=>tog("slow");
$("lines").onclick=()=>{tog("lines");runG.setAttribute("visibility",$("lines").getAttribute("aria-pressed")==="true"?"visible":"hidden")};
PLAYS.forEach((p,i)=>{const b=document.createElement("button");b.textContent=p.name;b.onclick=()=>{cur=i;opt=0;stop();t=0;build()};$("tabs").appendChild(b)});
build();
</script>
